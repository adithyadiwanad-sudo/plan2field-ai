[project]
name = "plan2field-worker"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = ["psycopg[binary]==3.2.10", "pgvector==0.4.1", "pydantic==2.12.3", "sentence-transformers==5.1.2", "openai-whisper==20250625", "openpyxl==3.1.5", "defusedxml==0.7.1", "Pillow==11.3.0", "pytesseract==0.3.13"]
[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["models: requires installed local model weights", "database: requires real PostgreSQL with pgvector"]
