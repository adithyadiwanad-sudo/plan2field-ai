          "requestId": {
            "type": "string"
          }
        }
      },
      "ProposalVersion": {
        "type": "object",
        "required": [
          "proposal_version"
        ],
        "properties": {
          "proposal_version": {
            "type": "integer",
            "minimum": 1
          }
        }
      },
      "ReviewReason": {
        "type": "object",
        "required": [
          "proposal_version",
          "reason"
        ],
        "properties": {
          "proposal_version": {
            "type": "integer",
            "minimum": 1
          },
          "reason": {
            "type": "string",
            "minLength": 3,
            "maxLength": 2000
          }
        }
      },
      "ReportSubmission": {
        "type": "object",
        "required": [
          "source_type",
          "reporting_date",
          "captured_at",
          "idempotency_key"
        ],
        "properties": {
          "source_type": {
            "enum": [
              "TEXT",
              "VOICE",
              "SPREADSHEET",
              "SCAN"
            ]
          },
          "original_text": {
            "type": "string",
            "maxLength": 50000
          },
          "reporting_date": {
            "type": "string",
            "format": "date"
          },
          "captured_at": {
            "type": "string",
            "format": "date-time"
          },
          "idempotency_key": {
            "type": "string",
            "format": "uuid"
          },
          "file": {
            "type": "string",
            "format": "binary"
          },
          "mapping": {
            "type": "string",
            "description": "JSON object mapping text to a spreadsheet column header"
          }
        }
      }
    }
  }
}