    "/api/auth/login": {
      "post": {
        "summary": "Start HttpOnly session",
        "operationId": "post__auth_login",
        "responses": {
          "200": {
            "description": "Successful response; reports/imports use asynchronous processing"
          },
          "400": {
            "description": "Validation failure",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "Sign-in required"
          },
          "403": {
            "description": "Project role or CSRF check failed"
          },
          "409": {
            "description": "Stale version or idempotency conflict"
          },
          "422": {
            "description": "Business-rule validation failed"
          },
          "503": {
            "description": "Dependency unavailable"
          }
        },
        "security": [],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "email",
                  "password"
                ],
                "properties": {
                  "email": {
                    "type": "string",
                    "format": "email"
                  },
                  "password": {
                    "type": "string"
                  }
                }
              }
            }
          }
